version: '3.8'

services:
  car-model:
    build:
      context: .
      dockerfile: Dockerfile
    image: lgm-car-model:latest
    container_name: lgm-car-model
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility,video
      - CUDA_VISIBLE_DEVICES=0
    volumes:
      # Input images directory
      - ./input:/workspace/input:ro
      # Output directory for 3D models
      - ./output:/workspace/output
      # Cache directory for models
      - ./cache:/workspace/.cache
      # Shared workspace
      - ./workspace:/workspace/workspace
      # Scripts directory
      - ./scripts:/workspace/scripts:ro
    ipc: host
    devices:
      - /dev/nvidia0:/dev/nvidia0
      - /dev/nvidia1:/dev/nvidia1
    restart: unless-stopped
    command: >
      bash -c "
        echo '=========================================' &&
        echo '  3D Car Model Generation Pipeline' &&
        echo '=========================================' &&
        echo '' &&
        echo 'Step 1: Preprocessing (Image normalization, masking)' &&
        python3 /workspace/scripts/preprocess.py --input_dir /workspace/input --output_dir /workspace/workspace/preprocessed &&
        echo '' &&
        echo 'Step 2: COLMAP (Camera estimation & Point cloud)' &&
        python3 /workspace/scripts/colmap.py --image_path /workspace/workspace/preprocessed --database_path /workspace/workspace/database.db --output_path /workspace/workspace/colmap_output &&
        echo '' &&
        echo 'Step 3: Dense Reconstruction (Multi-view Stereo)' &&
        colmap patch_match_stereo --workspace_path /workspace/workspace/stereo --database_path /workspace/workspace/database.db &&
        echo '' &&
        echo 'Step 4: Gaussian Splatting (High-quality 3D reconstruction)' &&
        python3 /workspace/scripts/gaussian_splatting.py --source /workspace/workspace/colmap_output --output_path /workspace/workspace/gaussian_splatting_output &&
        echo '' &&
        echo 'Step 5: Meshing (Poisson / Instant Meshes)' &&
        python3 /workspace/scripts/meshing.py --input /workspace/workspace/gaussian_splatting_output --output /workspace/output/model.glb &&
        echo '' &&
        echo 'Step 6: Texture Baking' &&
        python3 /workspace/scripts/texture_baking.py --input /workspace/output/model.glb --output /workspace/output/model_textured.glb &&
        echo '' &&
        echo 'Step 7: Video Generation (Car comparison)' &&
        python3 /workspace/scripts/blender_video.py --models_dir /workspace/output --output_video /workspace/output/car_comparison.mp4 &&
        echo '' &&
        echo '=========================================' &&
        echo '  Processing Complete!' &&
        echo '  Output: /workspace/output/' &&
        echo '=========================================' &&
        ls -la /workspace/output/
      "

  # Optional: Interactive shell for debugging
  car-model-shell:
    build:
      context: .
      dockerfile: Dockerfile
    image: lgm-car-model:latest
    container_name: lgm-car-model-shell
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility,video
    volumes:
      - ./input:/workspace/input:ro
      - ./output:/workspace/output
      - ./cache:/workspace/.cache
      - ./workspace:/workspace/workspace
      - ./scripts:/workspace/scripts:ro
    ipc: host
    devices:
      - /dev/nvidia0:/dev/nvidia0
    tty: true
    stdin_open: true
