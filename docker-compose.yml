version: '3.8'

services:
  # Web API Server (FastAPI)
  car-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: lgm-car-model:latest
    container_name: lgm-car-api
    # WSL2 NVIDIA GPUアクセス設定（CDI webgpu方式）
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu, compute, utility]
    volumes:
      # Input images directory
      - ./input:/workspace/input
      # Output directory for 3D models
      - ./output:/workspace/output
      # Cache directory for models
      - ./cache:/workspace/.cache
      # Shared workspace
      - ./workspace:/workspace/workspace
      # Scripts directory
      - ./scripts:/workspace/scripts:ro
      # App directory
      - ./app:/workspace/app
    ports:
      - "8000:8000"
    ipc: host
    restart: unless-stopped
    command: >
      bash -c "
        echo '=========================================' &&
        echo '  Starting FastAPI Server' &&
        echo '  Access: http://localhost:8000' &&
        echo '  API Docs: http://localhost:8000/docs' &&
        echo '=========================================' &&
        cd /workspace &&
        uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
      "

  # Legacy: Direct pipeline execution (for backward compatibility)
  # WSL2 NVIDIA CDI (Common Device Interface) webgpu方式を使用
  car-model:
    build:
      context: .
      dockerfile: Dockerfile
    image: lgm-car-model:latest
    container_name: lgm-car-model
    # WSL2 NVIDIA GPUアクセス設定（CDI webgpu方式）
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu, compute, utility]
    volumes:
      # Input images directory
      - ./input:/workspace/input:ro
      # Output directory for 3D models
      - ./output:/workspace/output
      # Cache directory for models
      - ./cache:/workspace/.cache
      # Shared workspace
      - ./workspace:/workspace/workspace
      # Scripts directory
      - ./scripts:/workspace/scripts:ro
      # Tests directory
      - ./tests:/workspace/tests:ro
      # Config files
      - ./pytest.ini:/workspace/pytest.ini:ro
      - ./pyproject.toml:/workspace/pyproject.toml:ro
    ipc: host
    restart: unless-stopped
    command: >
      bash -c "
        echo '=========================================' &&
        echo '  3D Car Model Generation Pipeline' &&
        echo '=========================================' &&
        echo '' &&
        echo 'Step 1: Preprocessing (Image normalization, masking)' &&
        (python3 /workspace/scripts/preprocess.py --input_dir /workspace/input --output_dir /workspace/workspace/preprocessed || echo 'Warning: Preprocessing skipped (no images)') &&
        echo '' &&
        echo 'Step 2: COLMAP (Camera estimation & Point cloud)' &&
        (python3 /workspace/scripts/colmap.py --image_path /workspace/workspace/preprocessed --database_path /workspace/workspace/database.db --output_path /workspace/workspace/colmap_output || echo 'Warning: COLMAP skipped') &&
        echo '' &&
        echo 'Step 3: Dense Reconstruction (Multi-view Stereo)' &&
        (colmap patch_match_stereo --workspace_path /workspace/workspace/stereo --database_path /workspace/workspace/database.db 2>/dev/null || echo 'Warning: Dense Reconstruction skipped') &&
        echo '' &&
        echo 'Step 4: Gaussian Splatting (High-quality 3D reconstruction)' &&
        (python3 /workspace/scripts/gaussian_splatting.py --source /workspace/workspace/colmap_output --output_path /workspace/workspace/gaussian_splatting_output || echo 'Warning: Gaussian Splatting skipped') &&
        echo '' &&
        echo 'Step 5: Meshing (Poisson / Instant Meshes)' &&
        (python3 /workspace/scripts/meshing.py --input /workspace/workspace/gaussian_splatting_output --output /workspace/output/model.glb || echo 'Warning: Meshing skipped') &&
        echo '' &&
        echo 'Step 6: Texture Baking' &&
        (python3 /workspace/scripts/texture_baking.py --input /workspace/output/model.glb --output /workspace/output/model_textured.glb || echo 'Warning: Texture Baking skipped') &&
        echo '' &&
        echo 'Step 7: Video Generation (Car comparison)' &&
        (python3 /workspace/scripts/blender_video.py --models_dir /workspace/output --output_video /workspace/output/car_comparison.mp4 || echo 'Warning: Video Generation skipped') &&
        echo '' &&
        echo '=========================================' &&
        echo '  Processing Complete (with warnings)' &&
        echo '  Output: /workspace/output/' &&
        echo '=========================================' &&
        ls -la /workspace/output/ 2>/dev/null || echo 'No output files yet' &&
        echo 'Container running for testing...' &&
        tail -f /dev/null
      "

  # Optional: Interactive shell for debugging
  # WSL2 NVIDIA CDI (Common Device Interface) webgpu方式を使用
  car-model-shell:
    build:
      context: .
      dockerfile: Dockerfile
    image: lgm-car-model:latest
    container_name: lgm-car-model-shell
    # WSL2 NVIDIA GPUアクセス設定（CDI webgpu方式）
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu, compute, utility]
    volumes:
      - ./input:/workspace/input:ro
      - ./output:/workspace/output
      - ./cache:/workspace/.cache
      - ./workspace:/workspace/workspace
      - ./scripts:/workspace/scripts:ro
    ipc: host
    tty: true
    stdin_open: true
