[pytest]
# pytest設定ファイル
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = 
    -v
    --tb=short
    --strict-markers
    --disable-warnings
markers =
    slow: slow running tests
    integration: integration tests
    unit: unit tests
    api: API endpoint tests

# Import設定
pythonpath = . ..

#ログ設定
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s (%(filename)s:%(lineno)s)
log_cli_date_format = %Y-%m-%d %H:%M:%S

#カバーレート設定
# addoptsに --cov=scripts --cov=app --cov-report=html を追加して使用
# pytest --cov运行
